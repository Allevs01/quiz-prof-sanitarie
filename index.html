ello atomico “a panettone”?", "answers": ["Thomson", "Bohr", "Dalton", "Rutherford", "Chadwick"], "correct": 0}, {"q": "A quale gruppo appartiene l’elemento con configurazione elettronica che termina in 4s² 4p⁵?", "answers": ["Alogeni", "Metalli alcalini", "Metalli alcalino-terrosi", "Gas nobili", "Metalli di transizione"], "correct": 0}, {"q": "Quale affermazione sulla tavola periodica è corretta?", "answers": ["Gli elementi del terzo periodo sono 8", "I metalli alcalini hanno le energie di prima ionizzazione più elevate", "Gli alogeni occupano il gruppo 18", "I metalli alcalino-terrosi occupano il secondo periodo", "L’elemento naturale col più alto Z è il polonio"], "correct": 0}, {"q": "Quali e quanti legami si formano complessivamente in C₂H₂?", "answers": ["3 legami σ e 2 legami π", "2 σ e 1 π", "1 σ e 3 π", "2 σ e 3 π", "2 σ e 2 π"], "correct": 0}, {"q": "Quale affermazione sugli orbitali ibridi è corretta?", "answers": ["Gli orbitali sp² sono complanari", "Si formano da tre o più orbitali atomici semplici", "Possono coinvolgere due orbitali s", "In BeH₂ il Be forma sp²", "Il carbonio può formare solo sp³"], "correct": 0}, {"q": "Qual è la formula dell’idrossido di potassio?", "answers": ["KOH", "K(OH)₂", "K(H₂O)", "POH", "P₂(OH)₃"], "correct": 0}, {"q": "Quale composto contiene un elemento con numero di ossidazione −3?", "answers": ["PH₃", "AlCl₃", "KHSO₄", "K₂Cr₂O₇", "CrO₃"], "correct": 0}, {"q": "Bilanciando aCu + bHNO₃ → cN₂O₄ + dCu(NO₃)₂ + eH₂O, quali sono R=a+b e P=c+d+e?", "answers": ["R=5, P=4", "R=3, P=3", "R=4, P=3", "R=3, P=5", "R=6, P=4"], "correct": 0}, {"q": "Quale schema di reazione NON è corretto?", "answers": ["Alogeno + idrogeno → idruro", "Metallo + ossigeno → ossido basico", "Metallo + non-metallo → sale binario", "Non-metallo + ossigeno → ossido acido", "Ossido basico + acqua → idrossido"], "correct": 0}, {"q": "Qual è la concentrazione di Ca(OH)₂ completamente dissociato con pH=11?", "answers": ["5,0×10⁻⁴ M", "3,0×10⁻³ M", "2,0×10⁻² M", "5,0×10⁻⁵ M", "4,0×10⁻¹ M"], "correct": 0}, {"q": "Quale molecola è chirale?", "answers": ["CH₃CHClC₂H₅", "C₂H₅CHClC₂H₅", "CHClCHCl", "CH₂ClCH₂Cl", "CH₂ClCH₂COOH"], "correct": 0}, {"q": "Quale è una reazione di ossidoriduzione?", "answers": ["N₂ + 3H₂ → 2NH₃", "P₂O₅ + 3H₂O → 2H₃PO₄", "NH₃ + H₂O → NH₄⁺ + OH⁻", "CaCO₃ → CaO + CO₂", "Na₂S + CuCl₂ → 2NaCl + CuS"], "correct": 0}, {"q": "Un oggetto di massa 2 kg è soggetto a F(x)=4x+8 N e percorre 4 m da fermo. Velocità finale?", "answers": ["8 m/s", "Dati insufficienti", "4 m/s", "32 m/s", "16 m/s"], "correct": 0}, {"q": "A e B distano d e 2d da un piano uniformemente carico positivamente. Quale relazione è vera?", "answers": ["V_A > V_B", "E_A > E_B", "V_A < V_B", "E_A < E_B", "V_A = V_B"], "correct": 0}, {"q": "In una trasformazione isocora la pressione del gas raddoppia. Quale affermazione è vera?", "answers": ["La temperatura in kelvin raddoppia", "Il volume dimezza", "Il lavoro del gas è positivo", "Il gas cede calore all’ambiente", "L’energia interna non varia"], "correct": 0}, {"q": "Due resistenze R e 3R sono in parallelo, poi in serie con una terza resistenza pari alla loro media. Resistenza equivalente?", "answers": ["11/4 R", "2 R", "4/11 R", "4/3 R", "3/4 R"], "correct": 0}, {"q": "Un elettrone e un protone con velocità opposte di modulo v entrano perpendicolarmente in B uniforme. Quale affermazione è vera?", "answers": ["Una particella ruota in senso orario e l’altra antiorario", "Sono deviate da parti opposte", "Le circonferenze hanno lo stesso raggio", "Hanno lo stesso periodo", "Hanno la stessa frequenza"], "correct": 0}, {"q": "Data una forza F applicata in P, quale definisce il momento M rispetto a O?", "answers": ["M è il prodotto vettoriale OP × F", "M è il prodotto scalare PO · F", "M è il prodotto vettoriale PO × F", "Nessuna delle altre", "M è il prodotto vettoriale F × OP"], "correct": 0}, {"q": "Quali fra f(x)=ln(x²), g(x)=2ln(x), h(x)=ln(2ˣ) hanno lo stesso grafico?", "answers": ["Nessuna ha lo stesso grafico di un’altra", "Solo f e g", "Solo f e h", "Solo g e h", "Tutte e tre"], "correct": 0}, {"q": "Qual è la soluzione della disequazione (2 − 3²)x − 2(x − 6) > 0?", "answers": ["x < 2", "x < 3", "x > 3", "x > 6", "x > 2"], "correct": 0}, {"q": "Nel triangolo rettangolo ABC descritto, prolungati i cateti con AD≅AC e AE≅AB, e con AH prolungata fino a ED in K, quale affermazione è vera?", "answers": ["AK è una mediana di ADE", "AK è una bisettrice di ADE", "AK è un’altezza di ADE", "AK è un asse di ADE", "Nessuna delle altre"], "correct": 0}, {"q": "Per il sistema indicato nel test, per quali valori di k è indeterminato e impossibile?", "answers": ["Indeterminato per k=−1, impossibile per k=1", "Indeterminato per k=−1, mai impossibile", "Indeterminato per k=1, impossibile per k=−1", "Mai indeterminato, impossibile per k=1", "Mai indeterminato o impossibile"], "correct": 0}, {"q": "Quali sono le coordinate del circocentro del triangolo O(0,0), A(72,0), B(0,30)?", "answers": ["(36, 15)", "(24, 10)", "(36, 10)", "(24, 15)", "Nessuna delle altre"], "correct": 0}, {"q": "Alla prima estrazione della tombola, qual è la probabilità che il numero sia multiplo di 5 o di 6?", "answers": ["1/3", "11/30", "1/6", "5/9", "7/15"], "correct": 0}, {"q": "Quali sono le coordinate dell’eventuale centro del fascio (1+k)x + (y−1)k + y + 1 = 0?", "answers": ["Il fascio è improprio, non ha centro", "(1, −1)", "(1, 1)", "(−1, 1)", "(−1, −1)"], "correct": 0}];
function seededShuffle(arr){
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
  return arr;
}
const quiz=source.map((x,qi)=>{
 let opts=x.answers.map((t,i)=>({t,correct:i===x.correct}));
 seededShuffle(opts);
 return {q:x.q,opts,chosen:null,number:qi+1};
});
let pos=0;
const qEl=document.getElementById('q'), aEl=document.getElementById('answers'), nEl=document.getElementById('next');
function render(){
 const x=quiz[pos]; document.getElementById('count').textContent=`${pos+1} / ${quiz.length}`;
 document.getElementById('fill').style.width=`${(pos/quiz.length)*100}%`; qEl.textContent=x.q;aEl.innerHTML='';
 x.opts.forEach((o,i)=>{let b=document.createElement('button');b.className='ans'+(x.chosen===i?' selected':'');
 b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)})</span>${o.t}`;
 b.onclick=()=>{x.chosen=i;render()};aEl.appendChild(b)});
 nEl.disabled=x.chosen===null;nEl.textContent=pos===quiz.length-1?'Termina e mostra risultato':'Conferma e continua';
}
nEl.onclick=()=>{if(pos<quiz.length-1){pos++;render()}else finish()};
function finish(){
 document.getElementById('quiz').classList.add('hide');let f=document.getElementById('final');f.classList.remove('hide');
 const wrong=quiz.filter(x=>!x.opts[x.chosen].correct), score=quiz.length-wrong.length;
 let s=`<h1>Risultato finale</h1><p class="good">${score} / ${quiz.length}</p><p>Hai sbagliato <b>${wrong.length}</b> ${wrong.length===1?'domanda':'domande'}.</p>`;
 if(!wrong.length)s+=`<div class="result">Perfetto: nessun errore.</div>`;
 else {s+=`<h2>Domande sbagliate</h2>`; wrong.forEach(x=>{let ci=x.opts.findIndex(o=>o.correct);
 s+=`<div class="result wrong"><b>Domanda ${x.number}</b><br>${x.q}<br><br><span class="muted">Tua risposta:</span> ${String.fromCharCode(65+x.chosen)}) ${x.opts[x.chosen].t}<br><span class="muted">Risposta corretta:</span> <b>${String.fromCharCode(65+ci)}) ${x.opts[ci].t}</b></div>`})}
 s+=`<button class="next" onclick="location.reload()">Ricomincia con risposte rimescolate</button>`;f.innerHTML=s;
}
render();
</script></body></html>
